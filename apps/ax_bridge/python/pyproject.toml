[project]
name = "axbridge"
version = "0.1.0"
description = "Host side of the Wixel ax_bridge firmware (Dynamixel/Feetech servos)"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.scripts]
axbridge = "axbridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axbridge"]
